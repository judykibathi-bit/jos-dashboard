<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JOS — Private Planner</title><style>:root{--bg:#f5f7fb;--card:#fff;--ink:#172033;--muted:#667085;--line:#e4e7ec;--accent:#4f46e5;--soft:#eef2ff;--danger:#b42318}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink)}button,input,textarea,select{font:inherit}button{border:1px solid #d0d5dd;border-radius:10px;padding:9px 12px;background:#fff;font-weight:700;cursor:pointer}button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}button.danger{color:var(--danger);border-color:#fecdca}.hidden{display:none!important}.wrap{max-width:1200px;margin:auto;padding:20px}.login{max-width:460px;margin:12vh auto}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.tabs,.actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.tab.active,.filter.active{background:var(--soft);color:#3730a3;border-color:#c7d2fe}.view{display:none}.view.active{display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field{margin:10px 0}.field label{display:block;font-size:12px;font-weight:800;color:var(--muted);margin-bottom:5px}.field input,.field textarea,.field select{width:100%;padding:10px;border:1px solid #d0d5dd;border-radius:9px}.field textarea{min-height:80px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.task{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid #eee;align-items:flex-start}.task:last-child{border-bottom:0}.task-main{flex:1}.task-title{font-weight:750}.done .task-title{text-decoration:line-through;color:var(--muted)}.meta{font-size:12px;color:var(--muted);margin-top:4px}.badge{display:inline-block;padding:3px 8px;border-radius:999px;background:#f2f4f7;font-size:11px;font-weight:700}.empty{color:var(--muted)}.notice{padding:10px;border-radius:9px;background:#f2f4f7;margin-top:10px;font-size:13px}.notice.ok{background:#ecfdf3}.notice.err{background:#fef3f2;color:#b42318}.day-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.day{border:1px solid var(--line);border-radius:11px;padding:9px;min-height:130px;background:#fff}.day-item{font-size:12px;padding:5px 0;border-bottom:1px solid #f2f4f7}.event{padding:10px;background:var(--soft);border-radius:10px;margin:7px 0}.modal{position:fixed;inset:0;background:#10182888;display:flex;align-items:center;justify-content:center;padding:15px}.modal-box{background:#fff;border-radius:16px;padding:20px;width:min(520px,100%);max-height:90vh;overflow:auto}@media(max-width:800px){.wrap{padding:12px}.top{display:block}.grid,.row{grid-template-columns:1fr}.day-grid{grid-template-columns:1fr}.day{min-height:auto}}</style></head><body><div id="login" class="wrap login"><div class="card"><h1>JOS</h1><p>Private weekly planner · clean rebuild</p><div class="field"><label>Email</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com"></div><button id="loginBtn" class="primary" type="button" disabled>Loading secure login…</button><div id="loginMsg" class="notice hidden"></div></div></div><main id="app" class="wrap hidden"><header class="top"><div><h1>JOS</h1><p>Judy Operating System · Private Planner</p></div><div><span id="userEmail" class="meta"></span> <button id="signout">Sign out</button></div></header><nav class="tabs"><button class="tab active" data-view="home">Today</button><button class="tab" data-view="week">This Week</button><button class="tab" data-view="tasks">Tasks</button><button class="tab" data-view="calendar">Calendar</button><button class="tab" data-view="review">Weekly Reset</button></nav><section id="home" class="view active"><div class="card"><h2>Today</h2><p>Tasks: <b id="todayTasks">0</b> · Done: <b id="todayDone">0</b> · Planned: <b id="todayMinutes">0</b> min</p><div id="todayTaskList"></div></div></section><section id="week" class="view"><div class="card"><h2>This Week</h2><div id="weekGrid" class="day-grid"></div></div></section><section id="tasks" class="view"><div class="grid"><div class="card"><h2 id="formHeading">Add task</h2><input id="editId" type="hidden"><div class="field"><label>Task</label><input id="taskTitle" placeholder="What needs to happen?"></div><div class="row"><div class="field"><label>Date</label><input id="taskDate" type="date"></div><div class="field"><label>Priority</label><select id="taskPriority"><option>normal</option><option>low</option><option>high</option><option>critical</option></select></div></div><div class="row"><div class="field"><label>Duration (minutes)</label><input id="taskDuration" type="number" min="0" step="15" value="30"></div><div class="field"><label>Category</label><input id="taskCategory" placeholder="Work, ministry, admin..."></div></div><div class="field"><label>Notes</label><textarea id="taskNotes"></textarea></div><button id="saveTask" class="primary">Add task</button> <button id="cancelEdit" class="hidden">Cancel edit</button></div><div class="card"><h2>Tasks</h2><div class="actions"><button id="openFilter" class="filter active">Open</button><button id="allFilter" class="filter">All</button></div><div id="taskList"></div></div></div></section><section id="calendar" class="view"><div class="grid"><div class="card"><h2>Add calendar item</h2><div class="field"><label>Title</label><input id="eventTitle"></div><div class="row"><div class="field"><label>Start</label><input id="eventStart" type="datetime-local"></div><div class="field"><label>End</label><input id="eventEnd" type="datetime-local"></div></div><div class="field"><label>Location</label><input id="eventLocation"></div><button id="addEvent" class="primary">Add calendar item</button></div><div class="card"><h2>Upcoming</h2><div id="eventList"></div></div></div></section><section id="review" class="view"><div class="card"><h2>Weekly Reset</h2><p>Review and reset your week here.</p></div></section></main><div id="modal" class="modal hidden"><div class="modal-box"><h2>Delete task?</h2><p id="deleteText"></p><button id="confirmDelete" class="danger">Delete permanently</button> <button id="cancelDelete">Cancel</button></div></div><script>const SUPABASE_URL='https://xizukaryehxuqgpexnmn.supabase.co',SUPABASE_KEY='sb_publishable_cz1r3U52XHTbuAxPkgZU9Q_VvrDWRfd',REDIRECT_URL='https://judykibathi-bit.github.io/jos-dashboard/',E=id=>document.getElementById(id);let db=null,user=null,tasks=[],events=[],showAll=false,deleteId=null;function msg(text,type=''){const m=E('loginMsg');m.textContent=text;m.className='notice'+(type?' '+type:'');m.classList.remove('hidden')}function showLogin(){E('app').classList.add('hidden');E('login').classList.remove('hidden')}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function today(){return new Date().toISOString().slice(0,10)}function fmtDate(d){return new Date(d+'T00:00:00').toLocaleDateString([], {weekday:'short',month:'short',day:'numeric'})}async function showApp(u){user=u;E('login').classList.add('hidden');E('app').classList.remove('hidden');E('userEmail').textContent=u.email||'';await load()}async function load(){const a=await db.from('jos_tasks').select('*').eq('user_id',user.id).order('scheduled_date').order('created_at');if(a.error){alert(a.error.message);return}tasks=a.data||[];const b=await db.from('jos_events').select('*').eq('user_id',user.id).order('starts_at');events=b.error?[]:(b.data||[]);render()}function taskHTML(t){return `<div class="task ${t.status==='done'?'done':''}"><input type="checkbox" data-done="${t.id}" ${t.status==='done'?'checked':''}><div class="task-main"><div class="task-title">${esc(t.title)}</div><div class="meta"><span class="badge">${esc(t.priority||'normal')}</span> · ${Number(t.duration_minutes||0)} min · ${esc(t.category||'Uncategorised')} · ${t.scheduled_date||'Unscheduled'}</div>${t.notes?`<div class="meta">${esc(t.notes)}</div>`:''}</div><button data-edit="${t.id}">Edit</button><button class="danger" data-delete="${t.id}">Delete</button></div>`}function render(){const d=today(),tt=tasks.filter(t=>t.scheduled_date===d);E('todayTasks').textContent=tt.length;E('todayDone').textContent=tt.filter(t=>t.status==='done').length;E('todayMinutes').textContent=tt.reduce((n,t)=>n+Number(t.duration_minutes||0),0);E('todayTaskList').innerHTML=tt.length?tt.map(taskHTML).join(''):'<p class="empty">Nothing scheduled today.</p>';const list=showAll?tasks:tasks.filter(t=>t.status!=='done'&&t.status!=='cancelled');E('taskList').innerHTML=list.length?list.map(taskHTML).join(''):'<p class="empty">No tasks here.</p>';renderWeek();renderEvents();wire()}function renderWeek(){const s=new Date();s.setHours(0,0,0,0);const day=s.getDay()||7;s.setDate(s.getDate()-day+1);let h='';for(let i=0;i<7;i++){const d=new Date(s);d.setDate(s.getDate()+i);const ds=d.toISOString().slice(0,10),ts=tasks.filter(t=>t.scheduled_date===ds);h+=`<div class="day"><b>${fmtDate(ds)}</b>${ts.map(t=>`<div class="day-item">${t.status==='done'?'✓':'○'} ${esc(t.title)}</div>`).join('')||'<div class="meta">Free</div>'}</div>`}E('weekGrid').innerHTML=h}function renderEvents(){E('eventList').innerHTML=events.length?events.map(e=>`<div class="event"><b>${esc(e.title)}</b><div class="meta">${new Date(e.starts_at).toLocaleString()}</div>${e.location?`<div class="meta">${esc(e.location)}</div>`:''}</div>`).join(''):'<p class="empty">No calendar items.</p>'}function wire(){document.querySelectorAll('[data-done]').forEach(x=>x.onclick=async()=>{const t=tasks.find(t=>t.id===x.dataset.done);if(!t)return;const r=await db.from('jos_tasks').update({status:x.checked?'done':'open',updated_at:new Date().toISOString()}).eq('id',t.id).eq('user_id',user.id);if(r.error)alert(r.error.message);else load()});document.querySelectorAll('[data-edit]').forEach(x=>x.onclick=()=>startEdit(x.dataset.edit));document.querySelectorAll('[data-delete]').forEach(x=>x.onclick=()=>askDelete(x.dataset.delete))}function startEdit(id){const t=tasks.find(t=>t.id===id);if(!t)return;E('editId').value=id;E('taskTitle').value=t.title||'';E('taskDate').value=t.scheduled_date||'';E('taskPriority').value=t.priority||'normal';E('taskDuration').value=t.duration_minutes||30;E('taskCategory').value=t.category||'';E('taskNotes').value=t.notes||'';E('formHeading').textContent='Edit task';E('saveTask').textContent='Save changes';E('cancelEdit').classList.remove('hidden');document.querySelector('[data-view="tasks"]').click();scrollTo({top:0,behavior:'smooth'})}function resetForm(){['editId','taskTitle','taskDate','taskCategory','taskNotes'].forEach(id=>E(id).value='');E('taskPriority').value='normal';E('taskDuration').value=30;E('formHeading').textContent='Add task';E('saveTask').textContent='Add task';E('cancelEdit').classList.add('hidden')}function askDelete(id){deleteId=id;const t=tasks.find(t=>t.id===id);E('deleteText').textContent=`“${t?.title||'This task'}” will be permanently removed.`;E('modal').classList.remove('hidden')}async function init(){try{const mod=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');db=mod.createClient(SUPABASE_URL,SUPABASE_KEY);E('loginBtn').disabled=false;E('loginBtn').textContent='Send secure login link';db.auth.onAuthStateChange((_,s)=>s?showApp(s.user):showLogin());const r=await db.auth.getSession();if(r.error)throw r.error;if(r.data.session)await showApp(r.data.session.user);else showLogin()}catch(e){showLogin();E('loginBtn').disabled=true;E('loginBtn').textContent='Secure login unavailable';msg('JOS could not load secure authentication: '+(e?.message||String(e)),'err')}}E('loginBtn').onclick=async()=>{const btn=E('loginBtn'),email=E('email').value.trim();if(!email){msg('Please enter your email address.','err');return}btn.disabled=true;msg('Connecting to secure login…');try{const r=await db.auth.signInWithOtp({email,options:{emailRedirectTo:REDIRECT_URL,shouldCreateUser:false}});if(r.error)throw r.error;msg('Secure login link sent. Check your email.','ok')}catch(e){msg('Login could not be started: '+(e?.message||String(e)),'err')}finally{btn.disabled=false}}E('signout').onclick=()=>db.auth.signOut();E('cancelDelete').onclick=()=>{deleteId=null;E('modal').classList.add('hidden')};E('confirmDelete').onclick=async()=>{if(!deleteId)return;const r=await db.from('jos_tasks').delete().eq('id',deleteId).eq('user_id',user.id);if(r.error)alert(r.error.message);else{deleteId=null;E('modal').classList.add('hidden');await load()}};E('saveTask').onclick=async()=>{const title=E('taskTitle').value.trim();if(!title)return alert('Enter a task.');const payload={title,scheduled_date:E('taskDate').value||null,priority:E('taskPriority').value,duration_minutes:Number(E('taskDuration').value||0),category:E('taskCategory').value.trim()||null,notes:E('taskNotes').value.trim()||null,updated_at:new Date().toISOString()};const id=E('editId').value;const r=id?await db.from('jos_tasks').update(payload).eq('id',id).eq('user_id',user.id):await db.from('jos_tasks').insert({...payload,user_id:user.id,status:'open'});if(r.error)alert(r.error.message);else{resetForm();await load()}};E('cancelEdit').onclick=resetForm;E('openFilter').onclick=()=>{showAll=false;E('openFilter').classList.add('active');E('allFilter').classList.remove('active');render()};E('allFilter').onclick=()=>{showAll=true;E('allFilter').classList.add('active');E('openFilter').classList.remove('active');render()};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));b.classList.add('active');E(b.dataset.view).classList.add('active')});init();</script></body></html>
