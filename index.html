<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JOS — Private Planner</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;font-family:system-ui;background:#f5f7fb;color:#182230}.wrap{max-width:1100px;margin:auto;padding:20px}.card{background:white;border:1px solid #e4e7ec;border-radius:16px;padding:20px;margin-bottom:16px}button,input{font:inherit;padding:10px;border:1px solid #d0d5dd;border-radius:9px}button{font-weight:700;cursor:pointer}.primary{background:#4f46e5;color:white;border-color:#4f46e5}.hidden{display:none}.field{margin:12px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}.field input{width:100%;box-sizing:border-box}.notice{margin-top:12px;padding:10px;background:#f2f4f7;border-radius:9px}.login{max-width:460px;margin:12vh auto}.top{display:flex;justify-content:space-between;align-items:center}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.view{display:none}.view.active{display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.task{padding:10px 0;border-bottom:1px solid #eee}@media(max-width:700px){.grid{grid-template-columns:1fr}.top{display:block}}</style></head><body><div id="login" class="wrap login"><div class="card"><h1>JOS</h1><p>Private weekly planner · pilot</p><div class="field"><label for="email">Email</label><input id="email" type="email" placeholder="you@example.com" autocomplete="email"></div><button id="loginBtn" class="primary" type="button">Send secure login link</button><div id="loginMsg" class="notice hidden"></div></div></div><main id="app" class="wrap hidden"><header class="top"><div><h1>JOS</h1><p>Judy Operating System · Private Planner</p></div><div><span id="userEmail"></span> <button id="signout" type="button">Sign out</button></div></header><nav class="tabs"><button class="tab" data-view="home">Today</button><button class="tab" data-view="tasks">Tasks</button><button class="tab" data-view="calendar">Calendar</button><button class="tab" data-view="review">Weekly Reset</button></nav><section id="home" class="view active"><div class="card"><h2>Today</h2><p>Tasks: <b id="todayTasks">0</b> · Done: <b id="todayDone">0</b> · Events: <b id="todayEvents">0</b></p><div id="todayTaskList"></div></div></section><section id="tasks" class="view"><div class="grid"><div class="card"><h2>Add task</h2><div class="field"><label>Task</label><input id="taskTitle" placeholder="What needs to happen?"></div><div class="field"><label>Date</label><input id="taskDate" type="date"></div><button id="addTask" class="primary" type="button">Add task</button></div><div class="card"><h2>Tasks</h2><div id="taskList"></div></div></div></section><section id="calendar" class="view"><div class="card"><h2>Calendar</h2><p>Calendar module ready for the next build pass.</p></div></section><section id="review" class="view"><div class="card"><h2>Weekly Reset</h2><p>Weekly review module ready for the next build pass.</p></div></section></main><script>const SUPABASE_URL='https://xizukaryehxuqgpexnmn.supabase.co';const SUPABASE_KEY='sb_publishable_cz1r3U52XHTbuAxPkgZU9Q_VvrDWRfd';const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const el=id=>document.getElementById(id);let user=null;function showLogin(){el('app').classList.add('hidden');el('login').classList.remove('hidden')}function showApp(u){user=u;el('login').classList.add('hidden');el('app').classList.remove('hidden');el('userEmail').textContent=u.email||'';loadTasks()}async function boot(){const r=await client.auth.getSession();if(r.data.session)showApp(r.data.session.user);else showLogin();client.auth.onAuthStateChange((event,session)=>{if(session)showApp(session.user);else showLogin()})}el('loginBtn').addEventListener('click',async()=>{const email=el('email').value.trim();if(!email){el('loginMsg').textContent='Please enter your email address.';el('loginMsg').classList.remove('hidden');return}el('loginBtn').disabled=true;el('loginBtn').textContent='Sending…';const {error}=await client.auth.signInWithOtp({email,options:{emailRedirectTo:window.location.href}});el('loginBtn').disabled=false;el('loginBtn').textContent='Send secure login link';el('loginMsg').textContent=error?error.message:'Secure login link sent. Check your email.';el('loginMsg').classList.remove('hidden')});el('signout').addEventListener('click',()=>client.auth.signOut());document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));el(b.dataset.view).classList.add('active')}));async function loadTasks(){const {data,error}=await client.from('jos_tasks').select('*').order('scheduled_date');if(error){el('taskList').textContent=error.message;return}const list=data||[];el('taskList').innerHTML=list.length?list.map(t=>`<div class="task">${t.status==='done'?'✓':'○'} ${String(t.title).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}</div>`).join(''):'No tasks yet.';const d=new Date().toISOString().slice(0,10);const today=list.filter(t=>t.scheduled_date===d);el('todayTasks').textContent=today.length;el('todayDone').textContent=today.filter(t=>t.status==='done').length}el('addTask').addEventListener('click',async()=>{const title=el('taskTitle').value.trim();if(!title)return alert('Please enter a task.');const {error}=await client.from('jos_tasks').insert({user_id:user.id,title,scheduled_date:el('taskDate').value||null});if(error)alert(error.message);else{el('taskTitle').value='';el('taskDate').value='';await loadTasks()}});boot();</script></body></html>
